name: Release (binaries)

on:
  push:
    tags:
      - "v*"

# needed in some orgs to allow creating/updating Releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system build dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y
          libclang-dev
          libwayland-dev
          libpipewire-0.3-dev
          libegl-dev
          libgbm-dev
          libdrm-dev
          libxcb1-dev
          libxcb-shm0-dev
          libxcb-randr0-dev

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN=crabture
          TAG="${GITHUB_REF_NAME}"
          TGT="x86_64-unknown-linux-gnu"
          SRC="target/release/${BIN}"
          TAR="crabture-${TAG}-${TGT}.tar.gz"
          chmod +x "${SRC}"
          cp LICENSE README.md target/release/ || true
          tar -czf "dist/${TAR}" -C target/release "${BIN}" LICENSE README.md
          echo "ASSET=dist/${TAR}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-x86_64-unknown-linux-gnu
          path: ${{ env.ASSET }}
